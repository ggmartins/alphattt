name: alphattt

services:
  mysql-service:
    image: "${MYSQL_IMAGE:-mysql:9.7.0}"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-***REMOVED***}"
      MYSQL_USER: "${MYSQL_USER:-***REMOVED***}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  my-app:
    image: "${APP_IMAGE:-my-app:v0}"
    build:
      context: .
    environment:
      DB_HOST: mysql-service
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE:-***REMOVED***}"
      DB_USER: "${MYSQL_USER:-***REMOVED***}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
    depends_on:
      mysql-service:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql-data:
